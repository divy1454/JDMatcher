<!doctype html>
<html>
<head><meta charset="utf-8"><title>Apply to Globex | LinkedIn</title>
  <style> body { font-family: sans-serif; } .jobs-easy-apply-modal { max-width: 520px; margin: 40px auto; border: 1px solid #ccc; padding: 16px; } input { width: 100%; padding: 6px; } </style>
</head>
<body>
  <div class="jobs-easy-apply-modal" role="dialog" aria-label="Apply to Globex">
    <h2>Contact info</h2>
    <label for="em">Email address</label><input id="em" type="text">
    <label for="ph">Mobile phone number</label><input id="ph" type="text" required>
    <label for="city">City</label><input id="city" type="text">
    <p><button id="next" aria-label="Continue to next step">Next</button></p>
  </div>
  <script>
    document.getElementById('next').addEventListener('click', () => { window.__nextClicked = (window.__nextClicked || 0) + 1; });
  </script>
</body>
</html>
