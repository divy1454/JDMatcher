<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <title>Apply for job post</title>
  <style>
    body { font-family: sans-serif; max-width: 720px; margin: 24px auto; }
    .field { margin-bottom: 14px; position: relative; }
    .q { margin: 0 0 4px; font-weight: 600; }
    input { width: 100%; padding: 6px; box-sizing: border-box; }
    button[aria-haspopup] { width: 100%; text-align: left; padding: 6px; background: #fff; border: 1px solid #999; }
    [data-list] { position: absolute; background: #fff; border: 1px solid #999; list-style: none; margin: 0; padding: 0; z-index: 10; }
    [data-list] li, #loc-list li { padding: 5px 8px; cursor: pointer; }
    #loc-list { list-style: none; margin: 0; padding: 0; border: 1px solid #999; position: absolute; background: #fff; width: 100%; z-index: 5; }
  </style>
</head>
<body>
  <!--
    Mimics a Rippling ATS application: the question is a <p> that isn't tied to its control, custom
    dropdowns are buttons with aria-label="Select" showing "Select", Location is a type-ahead whose
    suggestions read "City, ST, USA", and the self-identification questions are optional.
  -->
  <main>
    <h1>Senior Product Manager - eSource</h1>
    <form id="app" onsubmit="return false">
      <div class="field"><label for="first">First name *</label><input id="first" name="firstName" required></div>
      <div class="field"><label for="last">Last name *</label><input id="last" name="lastName" required></div>
      <div class="field"><label for="email">Email *</label><input id="email" name="email" type="email" required></div>
      <div class="field"><label for="phone">Phone number *</label><input id="phone" name="phone" type="tel" required></div>

      <div class="field">
        <p class="q">Location <span aria-hidden="true">*</span></p>
        <input id="loc" role="combobox" aria-autocomplete="list" aria-controls="loc-list" aria-expanded="false" aria-required="true" placeholder="Start typing..." autocomplete="off">
        <ul id="loc-list" role="listbox" hidden></ul>
      </div>

      <div class="field">
        <p class="q">Are you legally authorized to work in the United States? <span aria-hidden="true">*</span></p>
        <button type="button" id="q_auth" aria-haspopup="listbox" aria-label="Select" aria-required="true"><span class="ph">Select</span></button>
      </div>
      <div class="field">
        <p class="q">How did you hear about this job? <span aria-hidden="true">*</span></p>
        <button type="button" id="q_source" aria-haspopup="listbox" aria-label="Select" aria-required="true"><span class="ph">Select</span></button>
      </div>

      <h2>Voluntary self-identification</h2>
      <div class="field">
        <p class="q">Pronouns</p>
        <button type="button" id="q_pronouns" aria-haspopup="listbox" aria-label="Select"><span class="ph">Select</span></button>
      </div>
      <div class="field">
        <p class="q">Are you Hispanic/Latino?</p>
        <button type="button" id="q_hisp" aria-haspopup="listbox" aria-label="Select"><span class="ph">Select</span></button>
      </div>
      <div class="field">
        <p class="q">Race</p>
        <button type="button" id="q_race" aria-haspopup="listbox" aria-label="Select"><span class="ph">Select</span></button>
      </div>

      <button type="button" id="submit">Submit application</button>
    </form>
  </main>
  <script>
    const OPTIONS = {
      q_auth: ['Yes', 'No'],
      q_source: ['LinkedIn', 'Indeed', 'Company website', 'Referral', 'Other'],
      q_pronouns: ['He/Him', 'She/Her', 'They/Them', 'Prefer to self-describe'],
      q_hisp: ['Yes', 'No', "I don't wish to answer"],
      q_race: ['American Indian or Alaska Native', 'Asian', 'Black or African American', 'Native Hawaiian or Other Pacific Islander', 'White', 'Two or more races', "I don't wish to answer"],
    };
    window.__answers = {};

    // Dropdowns: the option list opens in a portal shortly after the click
    let openFor = null;
    let listEl = null;
    function closeList() {
      if (listEl) listEl.remove();
      listEl = null;
      openFor = null;
    }
    document.addEventListener('click', (e) => {
      const btn = e.target.closest('button[aria-haspopup="listbox"]');
      if (btn) {
        if (openFor === btn) return closeList();
        closeList();
        openFor = btn;
        const box = document.createElement('ul');
        box.setAttribute('role', 'listbox');
        box.setAttribute('data-list', '');
        const r = btn.getBoundingClientRect();
        box.style.left = r.left + window.scrollX + 'px';
        box.style.top = r.bottom + window.scrollY + 'px';
        box.innerHTML = OPTIONS[btn.id].map((o) => `<li role="option">${o}</li>`).join('');
        listEl = box;
        setTimeout(() => { if (openFor === btn) document.body.appendChild(box); }, 100);
        return;
      }
      const opt = e.target.closest('[role="option"]');
      if (opt && openFor && listEl && listEl.contains(opt)) {
        openFor.textContent = opt.textContent;
        openFor.dataset.value = opt.textContent;
        window.__answers[openFor.id] = opt.textContent;
        closeList();
        return;
      }
      if (!e.target.closest('[data-list]')) closeList();
    });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeList(); });

    // Location type-ahead: suggestions arrive a moment after typing, as "City, ST, USA"
    const cities = ['Austin, TX, USA', 'Austin, MN, USA', 'Charlotte, NC, USA', 'Charlotte, MI, USA'];
    const loc = document.getElementById('loc');
    const list = document.getElementById('loc-list');
    let timer = null;
    loc.addEventListener('input', () => {
      clearTimeout(timer);
      const q = loc.value.toLowerCase().trim();
      timer = setTimeout(() => {
        const hits = q.length >= 2 ? cities.filter((c) => c.toLowerCase().startsWith(q)) : [];
        list.innerHTML = hits.map((c) => `<li role="option">${c}</li>`).join('');
        list.hidden = hits.length === 0;
        loc.setAttribute('aria-expanded', String(hits.length > 0));
      }, 250);
    });
    list.addEventListener('click', (e) => {
      const li = e.target.closest('li');
      if (!li) return;
      loc.value = li.textContent;
      list.hidden = true;
      loc.setAttribute('aria-expanded', 'false');
    });

    document.getElementById('submit').addEventListener('click', () => { window.__submitClicked = (window.__submitClicked || 0) + 1; });
  </script>
</body>
</html>
