<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JDMatcher Enterprise</title>
    <link rel="stylesheet" href="./src/styles/shadow.css" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 440px;
        min-height: 580px;
        max-height: 600px;
        overflow-y: auto;
        overflow-x: hidden;
        background: #0b1329;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      /* Remove position fixed so popup fills Chrome popup window naturally */
      .jdm-popup-window {
        position: static !important;
        width: 100% !important;
        max-height: none !important;
        border-radius: 0 !important;
        box-shadow: none !important;
        border: none !important;
        animation: none !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/popup/index.tsx"></script>
  </body>
</html>
